<style>
:root{--bg:#f3f4f1;--ink:#1c2523;--mut:#64706d;--card:#ffffff;--card2:#f5f6f3;--line:#e1e5e0;--acc:#2f6f6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0e1314;--ink:#edf1ef;--mut:#98a6a2;--card:#172021;--card2:#1e2829;--line:#2a3637}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "DM Sans",system-ui,sans-serif;transition:background .4s,color .4s}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
.app{max-width:1600px;margin:0 auto;padding:14px 22px 20px;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px;margin-bottom:14px}
.brand{margin-right:auto}.brand b{display:block;font:600 1.2rem/1.2 Fraunces,Georgia,serif}.brand span{font-size:.78rem;color:var(--mut)}
.nav{display:flex;gap:2px;flex-wrap:wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px}
.nav button{background:none;border:0;border-radius:9px;padding:6px 12px;font-size:.84rem;font-weight:500;color:var(--mut);display:flex;gap:7px;align-items:center;transition:color .2s,background .2s}
.nav button i{width:7px;height:7px;border-radius:50%;display:none}
.nav button:hover{color:var(--ink)}
.nav button[aria-current=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,28,.12)}
.nav button[aria-current=true] i{display:block}
.nav button.seen::after{content:"";width:5px;height:9px;border:solid var(--acc);border-width:0 1.8px 1.8px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tools{display:flex;gap:6px}
.tools button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--mut);transition:color .2s,border-color .2s}
.tools button:hover{color:var(--ink);border-color:var(--mut)}.tools button[aria-pressed=true]{color:var(--acc);border-color:var(--acc)}
.tools svg{display:block}
.main{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:minmax(0,1fr);gap:16px;height:calc(100vh - 92px);min-height:560px}
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#e7ebe8;min-height:0}
[data-theme=dark] .stage{background:#171f23}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
#ov{pointer-events:none}
.prog{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);color:#1c2523;border-radius:999px;padding:5px 12px;font:600 .74rem "DM Sans",sans-serif;display:flex;gap:9px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.prog b{display:block;width:48px;height:4px;border-radius:2px;background:#dde2de;overflow:hidden}.prog b i{display:block;height:100%;background:#2f6f6b;transition:width .5s}
.cap{position:absolute;right:14px;bottom:12px;font-size:.72rem;color:#5d6a67;pointer-events:none}
[data-theme=dark] .cap{color:#9aa9a5}
.toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:#1c2523;color:#fff;border-radius:12px;padding:10px 14px;font-size:.86rem;display:flex;gap:12px;align-items:center;max-width:calc(100% - 24px);box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:5}
.toast button{background:#fff;color:#1c2523;border:0;border-radius:8px;padding:4px 10px;font-weight:600}
.hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.96);color:#1c2523;border-radius:14px;padding:9px 24px 10px;text-align:center;box-shadow:0 8px 26px rgba(20,40,35,.18);min-width:200px;pointer-events:none;z-index:3}
.hud:not(.on){display:none}.hud.on{animation:hudin .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes hudin{from{opacity:0;transform:translate(-50%,-12px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
.hud small{display:block;font:600 8.5px "DM Sans",sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#7b8a86}
.hud b{display:block;font:600 20px/1.25 Fraunces,Georgia,serif}.hud span{display:block;font-size:11px;color:#6b7b77}
.skip{position:absolute;top:88px;left:50%;transform:translateX(-50%);background:rgba(28,37,35,.8);color:#fff;border:0;border-radius:999px;padding:4px 14px;font:500 .76rem "DM Sans",sans-serif;z-index:3}
.ask{position:absolute;width:min(250px,calc(100% - 16px));background:#fff;color:#1c2523;border-radius:14px;padding:12px 12px 6px;box-shadow:0 16px 44px rgba(20,40,35,.26);z-index:4;animation:askin .5s cubic-bezier(.2,.8,.2,1) both;--tx:40px}
.ask::after{content:"";position:absolute;left:var(--tx);bottom:-7px;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:0 0 4px 0}
.ask small{font:600 8.5px "DM Sans",sans-serif;letter-spacing:.24em;color:#7b8a86;text-transform:uppercase}
.ask h3{font-size:1.2rem;line-height:1.2;margin:2px 0 1px}.ask p{margin:0 0 9px;font-size:.7rem;color:#7b8a86}
.ask .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.ask button{border:0;text-align:left;color:#2a3836;background:none}
.ask .opts button{background:#f1f2ef;border-radius:10px;padding:9px 10px;font-size:.72rem;line-height:1.25;display:flex;justify-content:space-between;gap:4px;animation:askin .45s cubic-bezier(.2,.8,.2,1) both;transition:background .2s}
.ask .opts button:nth-child(1){animation-delay:.12s}.ask .opts button:nth-child(2){animation-delay:.18s}.ask .opts button:nth-child(3){animation-delay:.24s}.ask .opts button:nth-child(4){animation-delay:.3s}
.ask .opts button:hover{background:#e0e8e4}
.ask i{font-style:normal;color:#8a9894}
.ask .boss{display:flex;gap:6px;padding:5px 2px;font-weight:600;font-size:.72rem;width:100%}
.ask .just{display:flex;gap:6px;padding:5px 2px;font-size:.7rem;color:#7b8a86;width:100%}
.ask .boss:hover,.ask .just:hover{text-decoration:underline}
@keyframes askin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;min-height:0}
.ph{padding:22px 26px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.eb{display:block;font:600 .68rem "DM Sans",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.ph h2{font-size:1.6rem;line-height:1.2}.ph p{margin:3px 0 0;font-size:.86rem;color:var(--mut)}
.pb{padding:18px 26px 30px;animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pb p{margin:0 0 12px;font-size:.92rem}
.sh{font:600 .68rem "DM Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:24px 0 10px}
.who{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.av{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 1rem Fraunces,Georgia,serif;flex:none}
.who b{font-weight:600}.who small{display:block;color:var(--mut);font-size:.82rem;line-height:1.35}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);margin:16px 0 4px}
.stats div{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats b{font:600 1.5rem/1.1 Fraunces,Georgia,serif;display:block}.stats span{font-size:.76rem;color:var(--mut)}
.menu{display:grid;border-top:1px solid var(--line)}
.menu button{background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;text-align:left;display:flex;gap:12px;align-items:center;font-size:.9rem;font-weight:500;transition:padding .2s,color .2s}
.menu button:hover{padding-left:8px;color:var(--acc)}
.menu .mi{color:var(--mut);display:grid;flex:none}.menu small{display:block;color:var(--mut);font-weight:400;font-size:.76rem;line-height:1.2}.menu .mt{flex:1}.menu i{font-style:normal;color:var(--mut)}
.proj{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.proj header{display:flex;gap:10px;justify-content:space-between;align-items:baseline}.proj h3{font-size:1.05rem;line-height:1.3}
.badge{font:600 .66rem "DM Sans",sans-serif;letter-spacing:.04em;border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:1px 7px;white-space:nowrap}
.proj p{margin:6px 0;font-size:.88rem;color:var(--mut)}.proj ul,.tl ul{margin:6px 0 4px;padding-left:18px;font-size:.86rem}.proj li,.tl li li{margin:3px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}.tags i{font-style:normal;font-size:.76rem;border:1px solid var(--line);background:var(--card2);border-radius:6px;padding:1px 9px}
.tl{list-style:none;margin:0;padding:0 0 0 20px;border-left:1px solid var(--line)}
.tl>li{position:relative;padding:0 0 20px 6px}.tl>li::before{content:"";position:absolute;left:-26px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--acc)}
.tl time{font-size:.74rem;color:var(--acc);font-weight:600;display:block;letter-spacing:.02em}.tl b{display:block;line-height:1.3;font-weight:600}.tl small{color:var(--mut);display:block;font-size:.8rem}.tl .d{font-size:.86rem;margin-top:4px}
.rows .r{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding:9px 0;font-size:.86rem}.rows .r:first-child{border-top:0}.rows .r b{font-weight:500}.rows .r span{color:var(--mut);text-align:right;white-space:nowrap}
.kv{display:grid;gap:8px}.kv .c{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px}.kv .c>span{color:var(--acc);display:grid;flex:none}
.kv small{color:var(--mut);display:block;font-size:.74rem;line-height:1.2}.kv .c div{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.9rem}.kv button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 10px;font-size:.76rem;color:var(--mut)}
.mf{display:grid;gap:10px}.mf label{font-size:.8rem;color:var(--mut);display:grid;gap:4px}
.mf input,.mf textarea{font:inherit;font-size:.9rem;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;resize:vertical}
.mf button,.pbtn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font-weight:600}
a{color:var(--acc);font-weight:500}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#quick{max-width:900px;margin:0 auto;width:100%}
.qh{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:14px}
.qh h2{font-size:1.9rem}.qh p{margin:2px 0;color:var(--mut)}
.qs{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 24px;margin-bottom:14px}
.qs>h3{font-size:1.2rem;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grab{display:none}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 90px rgba(20,32,30,.18)}
@media (max-width:960px){
 html,body{height:100%;overscroll-behavior:none}body{overflow:hidden}
 .app{height:100dvh;min-height:0;padding:8px 10px 0;display:flex;flex-direction:column}
 .top{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 10px;margin-bottom:8px}
 .brand{grid-column:1;grid-row:1;margin:0}.tools{grid-column:2;grid-row:1}.nav{grid-row:2}
 .brand b{font-size:.94rem;white-space:nowrap}.brand span{font-size:.7rem}
 .tools{gap:5px}.tools button{width:34px;height:34px;border-radius:10px}
 .nav{grid-column:1/-1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
 .nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;scroll-snap-align:center;padding:7px 13px}
 .main{display:block;flex:1 1 auto;min-height:0;height:auto;position:relative;margin-bottom:10px}
 .stage{height:100%;min-height:0;border-radius:16px}
 .prog{top:10px;bottom:auto;left:10px}.cap{display:none}
 .hud{top:10px;min-width:0;white-space:nowrap;padding:7px 18px 8px}.hud b{font-size:16.5px}.skip{top:74px}
 .panel{position:fixed;left:0;right:0;bottom:0;z-index:30;height:84dvh;max-height:84dvh;margin:0;border-radius:22px 22px 0 0;border-bottom:0;overflow:hidden;display:flex;flex-direction:column;
  transform:translateY(calc(100% - 82px - env(safe-area-inset-bottom,0px)));transition:transform .38s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 34px rgba(10,20,18,.22)}
 body.sheet-open .panel{transform:none}body.sheet-hide .panel{transform:translateY(105%)}
 .panel .ph{position:relative;flex:none;padding:8px 20px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
 .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
 .ph h2{font-size:1.28rem}.ph p{font-size:.8rem}.eb{margin-bottom:3px}
 .panel .pb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 20px calc(30px + env(safe-area-inset-bottom,0px))}
 body.quickmode{overflow:auto}body.quickmode .app{height:auto;overflow:visible}body.quickmode .top{position:sticky;top:0;z-index:5;background:var(--bg)}
}
@media (max-width:520px){.prog{display:none}.ask{width:calc(100% - 20px)}.ask h3{font-size:1.05rem}.ask p{margin-bottom:6px}.ask .opts button{padding:7px 9px}.stats b{font-size:1.3rem}.brand span{display:none}.menu button{padding:11px 2px}}
@media (prefers-reduced-motion:reduce){.pb{animation:none}*{transition:none!important}}
@media print{.top,.main,.cap,#tour{display:none!important}#quick,#quick[hidden]{display:block!important;max-width:none}body{background:#fff;color:#000}.qs,.qh{border:0;padding:6px 0;break-inside:avoid}.qh .pbtn{display:none}:root{--card:#fff;--card2:#f4f4f0;--ink:#000;--mut:#444}}
</style>

<body>
<div class="app">
<header class="top">
 <div class="brand"><b>Muhammad Abdullah Haroon</b><span>BS Mathematics · Data &amp; Web Development</span></div>
 <nav class="nav" id="nav" aria-label="Rooms"></nav>
 <div class="tools">
  <button id="bZoom" aria-pressed="true" title="Zoom in or out" aria-label="Zoom in or out"></button>
  <button id="bNight" aria-pressed="false" title="Day or night" aria-label="Day or night"></button>
  <button id="bReplay" title="Replay the entrance" aria-label="Replay the entrance"></button>
  <button id="bQuick" aria-pressed="false" title="Plain CV view" aria-label="Plain CV view"></button>
 </div>
</header>
<main class="main" id="tour">
 <section class="stage">
  <canvas id="c" tabindex="0" aria-label="Isometric office. Click the floor or use arrow keys to walk, or use the room tabs."></canvas>
  <canvas id="ov"></canvas>
  <div class="prog" id="prog"></div>

 </section>
 <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<noscript><p>Muhammad Abdullah Haroon, BS Mathematics student at Bahauddin Zakariya University, Multan. Projects: HARNECT, INFINITY-X, StockWise, Simplex Algorithm Solver. Contact: harooniqbal.ahi@gmail.com, 0309 0444016.</p></noscript>
</div>
<script>
const $=s=>document.querySelector(s);
const TW=72,TH=36,W=14,H=10,WALL=2.7,WWD=1240,WHT=700,OX=610,OY=150;
const cv=$('#c'),ov=$('#ov'),g=ov.getContext('2d');
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
let VW=900,VH=700,DPR=1,zoom=.6,camX=560,camY=360,follow=true,T=0,night=matchMedia('(prefers-color-scheme: dark)').matches,nm=night?1:0;
const iso=(x,y,z=0)=>[(x-y)*TW/2+OX,(x+y)*TH/2+OY-z*TH];
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const clr=(h,f)=>{let c;if(h[0]==='#'){const n=parseInt(h.slice(1),16);c=[n>>16&255,n>>8&255,n&255]}else c=h.match(/\d+/g).map(Number);return'rgb('+c.slice(0,3).map(v=>Math.max(0,Math.min(255,v*f))|0)+')'};

// ---------- zones
const Z={
 reception:{n:'Reception',i:'user',r:[-4,0,3,5],a:'#2f6f6b',d:[0,2]},
 studio:{n:'Work Studio',i:'code',r:[-10,6,-2,13],a:'#3f8068',d:[-6,9]},
 meeting:{n:'Meeting Room',i:'brief',r:[-1,6,4,13],a:'#6f679f',d:[1,7]},
 hub:{n:'Learning Hub',i:'cap',r:[-10,0,-5,5],a:'#a67f2a',d:[-7,1]},
 ops:{n:'Operations',i:'gear',r:[4,0,10,5],a:'#3f7391',d:[7,1]},
 boss:{n:'Boss Cabin',i:'mail',r:[5,6,10,13],a:'#9a5c42',d:[7,8]}};
const ORDER=['reception','studio','meeting','hub','ops','boss'];
const ICON={user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 13h18"/>',cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',pin:'<path d="M12 21s7-6 7-11a7 7 0 00-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',zoom:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M8 11h6M11 8v6"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',map:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/>',replay:'<path d="M4 5v5h5"/><path d="M4.6 14A8 8 0 108 6.3L4 10"/>'};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

// ---------- content
